<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tittel, beskrivelse, canonical, Open Graph og strukturerte data: src/seo/pages.js (settes inn av src/seo/vitePlugin.js) -->
    <!--seo-->
    <link rel="icon" type="image/svg+xml" href="/Arvklart Favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Tekst i rem følger brukerens innstilling: nettleserens standardstørrelse, iPhone-innstillingen
         (Dynamic Type) og valget «Tekststørrelse» i appen (src/lib/textSize.js). */
      html { font-size: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      @supports (font: -apple-system-body) and (-webkit-touch-callout: none) { html { font: -apple-system-body; } }
      body { background: #FBF9F5; font-family: 'Karla', sans-serif; color: #3A2F26; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-thumb { background: #D9CFC0; border-radius: 3px; }
      /* iOS zoomer inn på felt med skrift under 16px */
      @media (max-width: 600px) { input, select, textarea { font-size: max(16px, 1rem) !important; } }
      /* Synlig tastaturfokus overalt (WCAG 2.4.7). Mørk sage gir 5,2:1 mot snow; mørke flater setter sin egen farge */
      :focus-visible { outline: 3px solid #5F6E52; outline-offset: 2px; }
      /* Tekst utenfor skjermen, for skjermlesere */
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      /* Forhåndsrendret norsk side skjules for engelsk og innloggede til appen har tatt over (public/seo-early.js) */
      html.pr-client #root[data-prerendered] { visibility: hidden; }
      /* Samtykkespørsmålet (src/components/AnalyticsConsent.jsx). Plasseringen ligger her, ikke i
         komponenten, så den kan ta hensyn til skjermbredden og til de faste knappene på de
         offentlige sidene. Innholdet og de to valgene er uendret. */
      .consent-ask { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 10000; max-width: 440px; }
      /* Brede skjermer: til høyre, der markedssidene har luft, og smalere, så det ikke når inn
         over kontrollene i heroen. Til venstre dekket det faktaraden på «Slik fungerer det». */
      @media (min-width: 760px) { .consent-ask { left: auto; right: 24px; bottom: 24px; max-width: 380px; } }
      /* Markedssidene (.ak): spørsmålet står øverst, rett under den klebrige headeren
         (74 px, 62 px under 981 px), ikke nederst. Nederst dekket det i full bredde hele
         lenkelisten i bunnteksten og pauseknappen i heroen på mobil, og plassen som måtte
         reserveres for å få dem fri ble et tomt felt under bunnteksten. Øverst dekker det
         bare innledende tekst, så ingenting trenger å reserveres og den faste demoknappen
         kan stå framme. z-index under headeren (50), så headeren, den åpne mobilmenyen og
         «Hopp til innholdet» (999) ligger over. Logikken og de to valgene er uendret.
         De andre offentlige sidene (/personvern, /guider/…) bruker appens utforming og
         beholder plasseringen nederst, uendret. */
      body:has(.ak) .consent-ask { top: 86px; bottom: auto; z-index: 40; }
      @media (max-width: 979px) { body:has(.ak) .consent-ask { top: 74px; } }
    </style>
    <script src="/seo-early.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
